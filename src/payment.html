<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Stripe Checkout Session with Popup</title>
  <script src="https://js.stripe.com/v3"></script>
  <style>
    /* Add custom CSS to style the buttons */
    .button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007BFF; /* Modern blue color */
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
    }

    .button.cancel {
      background-color: #FF4A4A; /* Red color for "Cancel" button */
    }
  </style>
</head>
<body>

  <button id="loadStripeButton" class="button">Load Stripe Buy Button and Open Popup</button>


  <button id="cancelButton" class="button cancel" style="display: none;">Cancel</button>

  <div id="popupContainer" class="popup-container" style="display: none;">
    <div class="popup-content">
     
    </div>
  </div>

  <script>

    document.getElementById("loadStripeButton").addEventListener("click", function () {
      // Load the Stripe script dynamically
      const stripeScript = document.createElement("script");
      stripeScript.src = "https://js.stripe.com/v3/buy-button.js";
      stripeScript.async = true;
      document.head.appendChild(stripeScript);

      // Create and append the <stripe-buy-button> element
      const stripeBuyButton = document.createElement("stripe-buy-button");
      stripeBuyButton.setAttribute("buy-button-id", "buy_btn_1O4fRDErlJZO72L53va5QPRx");
      stripeBuyButton.setAttribute("publishable-key", "pk_test_51O4akXErlJZO72L5NqMt0BiNkmyxVPNGD4ZGAr45dI6Lz5xDqFSK8jmlVM2SZrY1dKr8MTbtry4k0y24cB9DJCec00pJEtcwD0");

      document.getElementById("popupContainer").querySelector('.popup-content').appendChild(stripeBuyButton);

      // Show the "Cancel" button and the popup
      document.getElementById("cancelButton").style.display = 'inline-block';
      document.getElementById("popupContainer").style.display = 'block';
    });

    // Add functionality to close the popup when "Cancel" button is clicked
    document.getElementById("cancelButton").addEventListener("click", function () {
      // Hide the "Cancel" button and the popup
      document.getElementById("cancelButton").style.display = 'none';
      document.getElementById("popupContainer").style.display = 'none';
    });
  </script>
</body>
</html>
